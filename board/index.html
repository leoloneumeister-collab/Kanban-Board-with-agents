<style>
/* Layout: sticky header with launch countdown, a compact command deck (pipeline, agent controls, Claude's plan), then a horizontally scrolling row of six columns; a wide dialog holds each ticket's brief, chat and result. */
:root {
  --bg: #F4F2F7;
  --col: #EAE6F0;
  --surface: #FFFFFF;
  --ink: #1B1624;
  --muted: #655D71;
  --line: #D9D2E2;
  --accent: #D1335D;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE3EA;
  --research: #0F7A76;
  --script: #C02E57;
  --production: #A2610A;
  --publishing: #2A63C4;
  --build: #4A7424;
  --warn: #B4400F;
  --ok: #217A4B;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13101A; --col: #1A1622; --surface: #221D2C; --ink: #EEE9F4; --muted: #A59CB2; --line: #332C3F;
    --accent: #FF5F88; --accent-ink: #1B0710; --accent-soft: #3A1826;
    --research: #3FC6BF; --script: #FF7598; --production: #F2A83C; --publishing: #74A7F7; --build: #9DCB6A; --warn: #FF8A55; --ok: #5FD394;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13101A; --col: #1A1622; --surface: #221D2C; --ink: #EEE9F4; --muted: #A59CB2; --line: #332C3F;
  --accent: #FF5F88; --accent-ink: #1B0710; --accent-soft: #3A1826;
  --research: #3FC6BF; --script: #FF7598; --production: #F2A83C; --publishing: #74A7F7; --build: #9DCB6A; --warn: #FF8A55; --ok: #5FD394;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 16px 12px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow, .label-sm { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 72%; font-size: clamp(28px, 5vw, 40px);
  line-height: .95; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance;
}
h1 em { font-style: normal; color: var(--accent); }
.countdown { display: flex; align-items: baseline; gap: 10px; }
.countdown .days { font-family: var(--display); font-weight: 800; font-stretch: 62%; font-size: 44px; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.countdown .label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.countdown .label strong { color: var(--ink); font-weight: 600; font-size: 13px; }

.deck { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; padding-block: 14px 4px; }
@media (max-width: 860px) { .deck { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-stretch: 85%; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.pipeline { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--col); }
.pipeline span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { border-left: 2px solid var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kpi strong { font-family: var(--display); font-stretch: 70%; font-weight: 750; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.alert { border-color: var(--warn); } .kpi.alert strong { color: var(--warn); }
.kpi span { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plan-summary { margin: 0; max-width: 65ch; }
.next-list, .sugg-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.next-list li, .sugg-list li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.keylink { font-family: var(--mono); font-size: 12px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.sugg-list li { justify-content: space-between; flex-wrap: wrap; }
.sugg-list .why { flex: 1; min-width: 180px; color: var(--muted); }
.muted { color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--body); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.spacer { flex: 1; }
button { font-family: var(--body); }
.btn { font: 600 13px/1 var(--body); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input, textarea { font: 400 14px/1.4 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
select.inline { width: auto; padding: 7px 8px; font-size: 13px; }
textarea { resize: vertical; min-height: 70px; }

.notice { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
.board-scroll { overflow-x: auto; padding-bottom: 24px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; min-width: min-content; align-items: start; }
.column { background: var(--col); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; max-width: 340px; }
.column.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-head { padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 2px; }
.col-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.col-title h2 { margin: 0; font-family: var(--display); font-weight: 700; font-stretch: 85%; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-hint { font-size: 12px; color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 10px; min-height: 60px; }
.empty-col { font-size: 12px; color: var(--muted); padding: 14px 6px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
.card { text-align: left; width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; cursor: grab; display: flex; flex-direction: column; gap: 8px; }
.card:hover { border-color: var(--muted); }
.card.dragging { opacity: .45; }
.card.working { border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.prio { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); }
.prio.P1 { color: var(--accent); border-color: var(--accent); }
.card-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.agent { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
.agent::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--agent-color, var(--muted)); }
.due { font-family: var(--mono); font-size: 11px; }
.due.soon { color: var(--warn); font-weight: 500; }
.flag { font-size: 11px; font-weight: 600; }
.flag.you { color: var(--production); } .flag.run { color: var(--accent); } .flag.err { color: var(--warn); } .flag.ok { color: var(--ok); } .flag.chat { color: var(--muted); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s, opacity .15s; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
}

dialog { width: min(900px, calc(100vw - 24px)); height: min(860px, calc(100dvh - 24px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(10 6 16 / .55); }
.dlg { display: flex; flex-direction: column; height: 100%; }
.dlg-head { padding: 16px 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dlg-head h3 { margin: 0; font-family: var(--display); font-weight: 750; font-stretch: 80%; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.tabs { display: flex; gap: 4px; margin-top: 4px; }
.tab { font: 600 13px/1 var(--body); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.dlg-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
.dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fact { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fact > span:first-child, .field label, .section h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 4px; }
.section h4 { margin: 0; font-weight: 500; }
.section p { margin: 0; max-width: 65ch; white-space: pre-wrap; }
.section ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; max-width: 65ch; }
.section.human { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.ai-edit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; background: var(--col); border-radius: 8px; padding: 8px 12px; }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; white-space: pre-wrap; }
.note time { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.close { margin-left: auto; }

.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; font-size: 14px; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--accent-soft); white-space: pre-wrap; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--col); border-bottom-left-radius: 4px; }
.msg.event { align-self: center; max-width: 100%; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 2px 8px; }
.chat-empty { color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.starters { display: flex; flex-wrap: wrap; gap: 6px; }
.composer { display: flex; gap: 8px; width: 100%; align-items: end; }
.composer textarea { min-height: 44px; max-height: 160px; }

.md { min-width: 0; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); font-stretch: 85%; line-height: 1.15; margin: 1em 0 .4em; }
.md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3, .md h4 { font-size: 15px; }
.md p, .md ul, .md ol { margin: .5em 0; max-width: 70ch; }
.md ul, .md ol { padding-left: 20px; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 13px; margin: .6em 0; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md a { color: var(--accent); }
.live { white-space: pre-wrap; font-size: 14px; }
.result-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100vw - 32px); }
.board-empty { padding: 40px 16px; text-align: center; color: var(--muted); max-width: 46ch; margin: 0 auto; }
</style>

<header class="gutter">
  <div class="brand">
    <span class="eyebrow">Short-form content plan · TikTok, Shorts, Reels</span>
    <h1>GTA 6 <em>Launch</em> Board</h1>
  </div>
  <div class="countdown" aria-live="polite">
    <span class="days" id="days">--</span>
    <span class="label"><strong id="days-label">days to launch</strong><span>Thu 19 Nov 2026 · consoles</span></span>
  </div>
</header>

<main>
  <section class="deck gutter" aria-label="Dashboard">
    <div class="panel">
      <div class="panel-head"><h2>Pipeline</h2><span class="label-sm" id="total">0 tickets</span></div>
      <div class="pipeline" id="pipeline" role="img" aria-label="Tickets per column"></div>
      <div class="legend" id="legend"></div>
      <div class="kpis">
        <div class="kpi" id="kpi-due"><strong id="k-due">0</strong><span>due in 3 days</span></div>
        <div class="kpi" id="kpi-you"><strong id="k-you">0</strong><span>need you</span></div>
        <div class="kpi"><strong id="k-run">0</strong><span>agents working</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run-all" type="button">Run ready tickets</button>
        <button class="btn" id="stop-all" type="button" hidden>Stop agents</button>
        <span class="muted" id="run-status" style="font-size:12px"></span>
      </div>
    </div>
    <div class="panel" id="plan-panel">
      <div class="panel-head"><h2>Claude's plan</h2><span class="label-sm" id="plan-age"></span></div>
      <div id="plan-body"><p class="plan-summary muted">Smart sort asks Claude to read every ticket, put each column in the best order and suggest what to do next.</p></div>
      <div class="actions"><button class="btn" id="smart-sort" type="button">Smart sort</button><span class="muted" id="sort-status" style="font-size:12px"></span></div>
    </div>
  </section>

  <div class="toolbar gutter">
    <div class="chips" id="filters" role="group" aria-label="Filter by agent"></div>
    <span class="spacer"></span>
    <label class="label-sm" for="sort-mode">Order</label>
    <select class="inline" id="sort-mode">
      <option value="manual">Board order</option>
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
      <option value="agent">Agent</option>
    </select>
    <button class="btn primary" id="new-ticket" type="button">New ticket</button>
  </div>
  <div class="gutter"><p class="notice" id="notice" hidden></p></div>
  <div class="board-scroll gutter"><div class="board" id="board"></div></div>
</main>

<dialog id="dialog" aria-labelledby="dlg-title"><div class="dlg" id="dlg"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const LAUNCH = new Date(2026, 10, 19);
const PROJECT = "Project: a solo creator is making short-form GTA 6 content for TikTok, YouTube Shorts and Instagram Reels. GTA 6 launches on PS5 and Xbox Series X|S on Thursday 19 November 2026; PC comes later.";
const COLUMNS = [
  { id: "backlog", name: "Backlog", hint: "Drafted, not reviewed yet", color: "var(--muted)" },
  { id: "review", name: "Your review", hint: "Read, chat, edit, then approve", color: "var(--production)" },
  { id: "ready", name: "Ready for agent", hint: "Approved. Run it or wait for Run all", color: "var(--publishing)" },
  { id: "doing", name: "Agent working", hint: "Claude is writing the result", color: "var(--accent)" },
  { id: "check", name: "Check result", hint: "Read what the agent made", color: "var(--research)" },
  { id: "done", name: "Done", hint: "Delivered and checked", color: "var(--ok)" },
];
const AGENTS = {
  research: { name: "Research agent", color: "var(--research)", role: "You are the research agent. You produce clear, decision-ready research notes for a beginner creator. You cannot browse the web here, so never invent links, numbers, follower counts or quotes. When a fact needs checking, mark it [verify] and say exactly where to check it." },
  script: { name: "Script agent", color: "var(--script)", role: "You are the script agent. You write short-form video scripts that hook in the first 2 seconds, are easy to read aloud, and list on-screen text and the footage needed for every beat." },
  production: { name: "Production agent", color: "var(--production)", role: "You are the production agent. You turn plans into practical step-by-step guides, shot lists and templates that one person on a low budget can follow." },
  publishing: { name: "Publishing agent", color: "var(--publishing)", role: "You are the publishing agent. You plan calendars, captions, profiles and posting schedules for TikTok, YouTube Shorts and Instagram Reels." },
  build: { name: "Coding agent", color: "var(--build)", role: "You are the coding agent. You design small, simple tools and give complete code files in fenced code blocks with file names, plus short setup steps. You can't run code or commit here, so list what should be tested." },
};
const PHASES = ["Setup", "Pre-launch", "Launch week", "Post-launch"];
const PRIORITIES = ["P1", "P2", "P3"];
const PRIO_RANK = { P1: 1, P2: 2, P3: 3 };
const EDITABLE = ["title", "goal", "context", "deliverable", "acceptance", "outOfScope", "human", "priority", "due", "agent", "phase"];
const FIELD_NAMES = { title: "title", goal: "goal", context: "context", deliverable: "deliverable", acceptance: "acceptance criteria", outOfScope: "out of scope", human: "needs you", priority: "priority", due: "due date", agent: "agent", phase: "phase" };

let db = null, sample = null, toolsOk = false, canWrite = true, loaded = false;
let tickets = new Map(), plan = null, filter = "all", sortMode = "manual";
let openId = null, tab = "brief", editing = false, messages = [], msgUnsub = null, msgFor = null;
let chatCtl = null, chatPending = null, chatBusy = false;
const activeRuns = new Map(); // ticket id -> { ctl, text }
let runAllActive = false, stopAll = false;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid);
  return n;
};
function mdNode(text, cls = "md") {
  const d = el("div", { class: cls });
  if (window.marked && window.DOMPurify) {
    d.innerHTML = DOMPurify.sanitize(marked.parse(String(text || "")));
    d.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  } else { d.textContent = text || ""; d.style.whiteSpace = "pre-wrap"; }
  return d;
}

  return [
    {
      name: "update_ticket",
      description: "Update fields of the current ticket. Pass only fields that change. acceptance is the full new list. Returns which fields changed.",
      inputSchema: { type: "object", properties: {
        title: str, goal: str, context: str, deliverable: str, outOfScope: str, human: { type: "string", description: "What only the creator can do. Empty string clears it." },
        acceptance: { type: "array", items: str }, priority: { type: "string", enum: PRIORITIES }, due: { type: "string", description: "YYYY-MM-DD" },
        agent: { type: "string", enum: Object.keys(AGENTS) }, phase: { type: "string", enum: PHASES } } },
      async execute(input) {
        const t = tickets.get(id); if (!t) throw new Error("Ticket not found");
        const data = {}, prev = {};
        for (const k of EDITABLE) {
          if (!(k in input) || input[k] == null) continue;
          let v = input[k];
          if (k === "acceptance") { if (!Array.isArray(v)) throw new Error("acceptance must be a list of strings"); v = v.map(String).map((s) => s.trim()).filter(Boolean); }
          else v = String(v).trim();
          if (k === "priority" && !PRIORITIES.includes(v)) throw new Error("priority must be P1, P2 or P3");
          if (k === "agent" && !AGENTS[v]) throw new Error("unknown agent");
          if (k === "phase" && !PHASES.includes(v)) throw new Error("unknown phase");
          if (k === "due" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) throw new Error("due must be YYYY-MM-DD");
          if (k === "title" && !v) continue;
          if (JSON.stringify(v) === JSON.stringify(t[k] ?? (k === "acceptance" ? [] : ""))) continue;
          data[k] = v; prev[k] = t[k] ?? (k === "acceptance" ? [] : "");
        }
        if (!Object.keys(data).length) return "Nothing changed.";
        await db.collection("tickets").doc(id).update({ ...data, lastAiEdit: { fields: prev, at: new Date().toISOString() } });
        const names = Object.keys(data).map((k) => FIELD_NAMES[k] || k).join(", ");
        addEvent(id, `Claude updated ${names}. Undo it on the Brief tab.`);
        return `Updated: ${names}`;
      },
    },
    {
      name: "save_result",
      description: "Save the complete deliverable for this ticket as Markdown. Replaces any earlier result and moves the ticket to Check result. Returns a confirmation.",
      inputSchema: { type: "object", properties: { markdown: { type: "string", description: "The full deliverable in Markdown" } }, required: ["markdown"] },
      async execute(input) {
        const md = String(input.markdown || "").trim(); if (md.length < 40) throw new Error("The result is too short to save");
        await db.collection("tickets").doc(id).update({ output: md, outputAt: new Date().toISOString(), run: { status: "done", at: new Date().toISOString(), via: "chat" }, column: "check", order: orderFor("check", id, null) });
        addEvent(id, "Claude saved a result. See the Result tab.");
        return "Saved. The ticket is now in Check result.";
      },
    },
    {
      name: "move_ticket",
      description: "Move the ticket to another column. Only use when the creator asks.",
      inputSchema: { type: "object", properties: { column: { type: "string", enum: COLUMNS.map((c) => c.id) } }, required: ["column"] },
      async execute(input) {
        const col = String(input.column);
        if (!(await moveTicket(id, col, null))) throw new Error("Move failed");
        addEvent(id, `Claude moved the ticket to ${COLUMNS.find((c) => c.id === col).name}.`);
        return "Moved.";
      },
    },
  ];
}
async function sendChat(id, preset) {
  if (!sample || chatBusy || !canWrite) return;
  const input = $("chat-input");
  const text = (preset || (input ? input.value : "")).trim(); if (!text) return;
  const t = tickets.get(id); if (!t) return;
  const history = messages.filter((m) => m.role !== "event").slice(-16).map((m) => ({ role: m.role, content: m.text }));
  const turns = [{ role: "user", content: chatRules(t) }, ...history, { role: "user", content: text }];
  chatBusy = true; chatCtl = new AbortController(); chatPending = { user: text, text: "" };
  if (input) input.value = "";
  renderDialog();
  const now = new Date().toISOString();
  try { await db.collection(`tickets/${id}/messages`).add({ role: "user", text, at: now }); chatPending.user = null; }
  catch (e) { handleWriteError(e); }
  const showLive = () => {
    if (openId !== id || tab !== "chat") return;
    const live = $("chat-live"); if (!live) return renderDialog();
    live.replaceChildren(chatPending.text ? mdNode(chatPending.text) : el("span", { class: "muted pulse", text: chatPending.status || "Thinking…" }));
    const body = $("dlg").querySelector(".dlg-body"); if (body) body.scrollTop = body.scrollHeight;
  };
  const tools = toolsOk ? chatTools(id).map((tool) => ({ ...tool, execute: async (inp, ctx) => {
    chatPending.status = tool.name === "save_result" ? "Saving the result…" : tool.name === "update_ticket" ? "Updating the ticket…" : "Moving the ticket…";
    showLive(); const r = await tool.execute(inp, ctx); return r;
  } })) : undefined;
  let reply = "", failed = null;
  try {
    const res = await sample(turns, { cache: false, signal: chatCtl.signal, tools, onText: ({ text: tx }) => { chatPending.text = tx; showLive(); } });
    reply = res.text + (res.truncated ? "\n\n_(Cut short. Ask for the rest.)_" : "");
  } catch (e) {
    reply = e && e.text ? e.text + "\n\n_(Interrupted)_" : "";
    if (e && e.code !== "cancelled") failed = sampleError(e);
    if (e && e.code === "tools_unavailable") toolsOk = false;
  }
  try {
    if (reply.trim()) await db.collection(`tickets/${id}/messages`).add({ role: "assistant", text: reply, at: new Date().toISOString() });
    const cur = tickets.get(id);
    await db.collection("tickets").doc(id).update({ chatCount: (cur && cur.chatCount || 0) + (reply.trim() ? 2 : 1) });
  } catch (e) { handleWriteError(e); }
  chatBusy = false; chatCtl = null; chatPending = null;
  if (failed) addEvent(id, failed);
  if (openId === id && !editing) renderDialog();
}

/* ---------- agent runs ---------- */
function agentPrompt(t, chatList) {
  const a = AGENTS[t.agent];
  const chat = chatDigest(chatList || []);
  return [
    a ? a.role : "You are a helpful agent.",
    PROJECT, `Today is ${todayISO()}.`,
    "Write for a beginner creator: plain language, short sentences, no filler. Follow the acceptance criteria exactly.",
    "You cannot browse the web. Never invent links, statistics or quotes; mark unverified facts [verify] and say where to check them.",
    "", "TICKET", brief(t),
    chat ? "\nCONVERSATION WITH THE CREATOR ABOUT THIS TICKET (use it as extra context)\n" + chat : "",
    t.output ? "\nEARLIER RESULT (improve on it, don't repeat its mistakes)\n" + t.output.slice(0, 6000) : "",
    "", "Now write the complete deliverable in Markdown. Start with a one-line summary. End with two sections: \"Acceptance check\" (each criterion marked met or not met) and \"To verify\" (every fact that needs checking, or \"Nothing\").",
  ].join("\n");
}
async function runAgent(id) {
  const t = tickets.get(id);
  if (!t || !sample || activeRuns.has(id)) return { ok: false };
  const ctl = new AbortController(); const run = { ctl, text: "" };
  activeRuns.set(id, run); renderDeck();
  await write(id, { column: "doing", order: orderFor("doing", id, null), run: { status: "running", at: new Date().toISOString() } });
  const live = () => { if (openId === id && tab === "result" && !editing) { const n = $("live-output"); if (n) n.textContent = run.text; else renderDialog(); } };
  let result = { ok: true };
  try {
    let chatList = msgFor === id ? messages : [];
    if (msgFor !== id) { try { chatList = (await db.collection(`tickets/${id}/messages`).orderBy("at").limit(300).get()).docs.map((d) => d.data()); } catch {} }
    const res = await sample(agentPrompt(tickets.get(id) || t, chatList), { cache: false, signal: ctl.signal, onText: ({ text }) => { run.text = text; live(); } });
    const out = res.text + (res.truncated ? "\n\n_(The agent hit its length limit here. Ask for the rest in the chat.)_" : "");
    await write(id, { output: out, outputAt: new Date().toISOString(), run: { status: "done", at: new Date().toISOString() }, column: "check", order: orderFor("check", id, null) });
    addEvent(id, "Agent run finished. See the Result tab.");
  } catch (e) {
    const cancelled = e && e.code === "cancelled";
    const data = { column: "ready", order: orderFor("ready", id, null), run: { status: cancelled ? "stopped" : "error", at: new Date().toISOString(), message: cancelled ? "Stopped" : sampleError(e) } };
    await write(id, data);
    if (!cancelled) addEvent(id, "Agent run failed: " + sampleError(e));
    result = { ok: false, code: e && e.code };
  } finally {
    activeRuns.delete(id); renderAll();
  }
  return result;
}
async function runAllReady() {
  if (runAllActive || !sample) return;
  const queue = sortedIn("ready").map((t) => t.id);
  if (!queue.length) return;
  runAllActive = true; stopAll = false; renderDeck();
  let done = 0, failed = 0; const total = queue.length;
  const status = () => { $("run-status").textContent = runAllActive ? `${done + failed} of ${total} finished · 2 run at a time · keep this tab open` : ""; };
  status();
  const worker = async () => {
    while (queue.length && !stopAll) {
      const id = queue.shift(); if (!tickets.has(id) || tickets.get(id).column !== "ready") continue;
      const r = await runAgent(id);
      if (r.ok) done++; else failed++;
      if (r.code && FATAL.has(r.code)) { stopAll = true; notice(sampleError({ code: r.code })); }
      status();
    }
  };
  await Promise.all([worker(), worker()]);
  runAllActive = false; status(); renderDeck();
  toast(stopAll ? `Stopped. ${done} finished.` : `${done} ticket${done === 1 ? "" : "s"} ready to check${failed ? `, ${failed} failed` : ""}`);
}
$("run-all").addEventListener("click", runAllReady);
$("stop-all").addEventListener("click", () => { stopAll = true; for (const r of activeRuns.values()) r.ctl.abort(); });

function resultTab(t) {
  const run = activeRuns.get(t.id);
  const body = el("div", { class: "dlg-body" });
  if (run) {
    body.append(el("div", { class: "result-meta" }, el("span", { class: "flag run pulse", text: "Agent is writing…" }), el("span", { text: "Keep this tab open until it finishes." })),
      el("div", { class: "live", id: "live-output", text: run.text || "Thinking. The first words can take up to a minute." }));
  } else if (t.output) {
    body.append(el("div", { class: "result-meta" }, el("span", { text: `Saved ${ago(t.outputAt)}` }), t.run && t.run.via === "chat" ? el("span", { text: "from the chat" }) : null), mdNode(t.output));
  } else {
    body.append(el("div", { class: "chat-empty" },
      el("p", { style: "margin:0", text: "No result yet. Run the agent to have Claude do this ticket, using the brief and everything you've said in the chat." }),
      t.run && t.run.status === "error" ? el("p", { class: "notice", style: "margin:0", text: t.run.message || "The last run failed." }) : null));
  }
  const foot = el("div", { class: "dlg-foot" },
    run ? el("button", { class: "btn", type: "button", text: "Stop", onclick: () => run.ctl.abort() })
      : el("button", { class: "btn primary", type: "button", text: t.output ? "Run again" : "Run agent", disabled: !sample || !canWrite, onclick: () => runAgent(t.id) }),
    !run && t.output && canWrite && t.column !== "done" ? el("button", { class: "btn", type: "button", text: "Approve result", onclick: () => moveTicket(t.id, "done", null) }) : null,
    !run && t.output && canWrite ? el("button", { class: "btn", type: "button", text: "Ask for changes", onclick: () => { tab = "chat"; renderDialog(); setTimeout(() => { const i = $("chat-input"); if (i) { i.value = "Change the result: "; i.focus(); } }, 0); } }) : null,
    el("span", { class: "spacer" }),
    !run && t.output ? el("button", { class: "btn", type: "button", text: "Copy result", onclick: () => copyText(t.output, "Result copied") }) : null);
  return [body, foot];
}

/* ---------- smart sort ---------- */
async function smartSort() {
  if (!sample || !tickets.size) return;
  const btn = $("smart-sort"); btn.disabled = true; $("sort-status").textContent = "Claude is reading the board…";
  const rows = [...tickets.values()].sort((a, b) => (a.key || a.id).localeCompare(b.key || b.id)).map((t) => ({
    key: t.key || t.id, title: t.title, column: t.column, agent: t.agent, priority: t.priority, phase: t.phase, due: t.due,
    needsCreator: !!t.human, hasResult: !!t.output, context: (t.context || "").slice(0, 220),
  }));
  const prompt = [
    `You are planning a solo creator's Kanban board. ${PROJECT} Today is ${todayISO()}.`,
    "Columns in flow order: backlog, review (creator reviews), ready (approved for an agent), doing, check (creator checks result), done.",
    "Tasks: 1) Order the tickets inside each column so the most urgent and most blocking work is first. Consider due dates, priority, dependencies mentioned in context (\"Depends on GTA-01\") and the launch date. 2) Pick up to 3 tickets the creator should act on next. 3) Suggest at most 5 changes: moving a ticket (action \"move\", to = column id), changing priority (action \"priority\", to = P1|P2|P3) or due date (action \"due\", to = YYYY-MM-DD). Only suggest changes with a clear reason. Never suggest moving to done.",
    "Reply with only JSON in this shape:",
    '{"summary":"2-3 plain sentences on where the plan stands and the biggest risk","order":{"backlog":["GTA-05"],"review":[],"ready":[],"doing":[],"check":[],"done":[]},"next":[{"key":"GTA-01","why":"short reason"}],"suggestions":[{"key":"GTA-09","action":"priority","to":"P2","why":"short reason"}]}',
    "Every ticket key must appear exactly once in order, in its current column.",
    "", "TICKETS", JSON.stringify(rows),
  ].join("\n");
  try {
    const res = await sample.json(prompt, { cache: false });
    if (!res || typeof res !== "object") throw { code: "invalid_json" };
    let moved = 0;
    for (const col of COLUMNS) {
      const keys = Array.isArray(res.order && res.order[col.id]) ? res.order[col.id].map(String) : [];
      const inCol = sortedIn(col.id);
      const ranked = [...keys.map((k) => inCol.find((t) => (t.key || t.id) === k)).filter(Boolean), ...inCol.filter((t) => !keys.includes(t.key || t.id))];
      const seen = new Set();
      let i = 1;
      for (const t of ranked) {
        if (seen.has(t.id)) continue; seen.add(t.id);
        if (t.order !== i) { await db.collection("tickets").doc(t.id).update({ order: i }); moved++; }
        i++;
      }
    }
    const clean = (arr, n) => (Array.isArray(arr) ? arr : []).slice(0, n).filter((x) => x && typeof x === "object").map((x) => ({ key: String(x.key || ""), why: String(x.why || ""), action: x.action ? String(x.action) : undefined, to: x.to != null ? String(x.to) : undefined }));
    const suggestions = clean(res.suggestions, 5).filter((s) => ["move", "priority", "due"].includes(s.action) && s.to && tickets.has(s.key) && s.to !== "done").map((s, i) => ({ ...s, id: "s" + i }));
    await db.collection("meta").doc("plan").set({ summary: String(res.summary || ""), next: clean(res.next, 3), suggestions, at: new Date().toISOString() });
    sortMode = "manual"; $("sort-mode").value = "manual";
    $("sort-status").textContent = moved ? `Reordered ${moved} ticket${moved === 1 ? "" : "s"}` : "Order already looked right";
  } catch (e) {
    $("sort-status").textContent = sampleError(e);
  } finally { btn.disabled = !sample || !canWrite; }
}
$("smart-sort").addEventListener("click", smartSort);
async function markSuggestion(s, field) {
  if (!plan) return;
  const suggestions = (plan.suggestions || []).map((x) => (x.id === s.id ? { ...x, [field]: true } : x));
  try { await db.collection("meta").doc("plan").update({ suggestions }); } catch (e) { handleWriteError(e); }
}
async function applySuggestion(s) {
  const t = tickets.get(s.key); if (!t) return;
  let ok = false;
  if (s.action === "move") ok = await moveTicket(t.id, s.to, null);
  else if (s.action === "priority" && PRIORITIES.includes(s.to)) ok = await write(t.id, { priority: s.to }, `${s.key} set to ${s.to}`);
  else if (s.action === "due" && /^\d{4}-\d{2}-\d{2}$/.test(s.to)) ok = await write(t.id, { due: s.to }, `${s.key} due ${fmtDate(s.to)}`);
  if (ok) markSuggestion(s, "applied");
}

/* ---------- edit form ---------- */
function field(label, input) { return el("div", { class: "field" }, el("label", { for: input.id, text: label }), input); }
function editForm(t) {
  const v = t || { column: "backlog", agent: "research", priority: "P2", phase: "Pre-launch", acceptance: [] };
  const inp = (id, value, type = "text") => { const i = el("input", { id, type }); i.value = value || ""; return i; };
  const area = (id, value, rows = 3) => { const a = el("textarea", { id, rows: String(rows) }); a.value = value || ""; return a; };
  const sel = (id, options, value) => el("select", { id }, options.map(([val, label]) => el("option", { value: val, selected: val === value, text: label })));
  const f = {
    title: inp("f-title", v.title), agent: sel("f-agent", Object.entries(AGENTS).map(([k, a]) => [k, a.name]), v.agent),
    priority: sel("f-priority", PRIORITIES.map((p) => [p, p]), v.priority), phase: sel("f-phase", PHASES.map((p) => [p, p]), v.phase),
    due: inp("f-due", v.due, "date"), goal: area("f-goal", v.goal, 2), context: area("f-context", v.context, 4),
    deliverable: area("f-deliverable", v.deliverable, 3), acceptance: area("f-acceptance", (v.acceptance || []).join("\n"), 4),
    outOfScope: area("f-oos", v.outOfScope, 2), human: area("f-human", v.human, 2),
  };
  const err = el("p", { class: "notice", hidden: true });
  const save = async () => {
    const title = f.title.value.trim();
    if (!title) { err.textContent = "Give the ticket a title before saving."; err.hidden = false; f.title.focus(); return; }
    const data = { title, agent: f.agent.value, priority: f.priority.value, phase: f.phase.value, due: f.due.value,
      goal: f.goal.value.trim(), context: f.context.value.trim(), deliverable: f.deliverable.value.trim(),
      acceptance: f.acceptance.value.split("\n").map((s) => s.trim()).filter(Boolean), outOfScope: f.outOfScope.value.trim(), human: f.human.value.trim() };
    try {
      if (t) { await db.collection("tickets").doc(t.id).update(data); toast("Ticket saved"); editing = false; renderDialog(); }
      else {
        const id = nextKey();
        await db.collection("tickets").doc(id).set({ ...data, key: id, column: "backlog", order: orderFor("backlog", id, null), notes: [] });
        toast("Ticket added to Backlog"); editing = false; openTicket(id);
      }
    } catch (e) { handleWriteError(e); }
  };
  const confirmBox = el("span", { hidden: true }, el("span", { text: "Delete for good? ", style: "font-size:13px" }),
    el("button", { class: "btn danger", type: "button", text: "Yes, delete", onclick: async () => {
      try { await db.collection("tickets").doc(t.id).delete(); toast("Ticket deleted"); closeDialog(); } catch (e) { handleWriteError(e); }
    } }));
  const head = el("div", { class: "dlg-head", style: "padding-bottom:12px" },
    el("div", { class: "card-top" }, el("span", { text: t ? `Editing ${t.key || t.id}` : "New ticket" }),
      el("button", { class: "btn sm close", type: "button", text: "Cancel", onclick: () => { if (t) { editing = false; renderDialog(); } else closeDialog(); } })),
    el("h3", { id: "dlg-title", text: t ? t.title : "Write a ticket an agent can act on" }));
  const body = el("div", { class: "dlg-body" }, err, field("Title", f.title),
    el("div", { class: "grid-2" }, field("Agent", f.agent), field("Priority", f.priority), field("Phase", f.phase), field("Due", f.due)),
    field("Goal: one sentence on the outcome", f.goal), field("Context: what the agent needs to know", f.context),
    field("Deliverable: what it hands back", f.deliverable), field("Acceptance criteria: one per line", f.acceptance),
    field("Out of scope", f.outOfScope), field("Needs you: what only you can do", f.human));
  const foot = el("div", { class: "dlg-foot" },
    el("button", { class: "btn primary", type: "button", text: t ? "Save changes" : "Add ticket", onclick: save }),
    el("span", { class: "spacer" }),
    t ? el("button", { class: "btn danger", type: "button", text: "Delete ticket", onclick: (e) => { e.currentTarget.hidden = true; confirmBox.hidden = false; } }) : null,
    confirmBox);
  return [head, body, foot];
}
function nextKey() {
  let max = 0;
  for (const t of tickets.values()) { const m = /^GTA-(\d+)$/.exec(t.key || t.id); if (m) max = Math.max(max, Number(m[1])); }
  return "GTA-" + String(max + 1).padStart(2, "0");
}
$("new-ticket").addEventListener("click", () => {
  if (!db) { toast("The board can't save right now."); return; }
  if (msgUnsub) { msgUnsub(); msgUnsub = null; msgFor = null; messages = []; }
  openId = "__new"; editing = true; renderDialog(); if (!$("dialog").open) $("dialog").showModal();
});
$("sort-mode").addEventListener("change", (e) => { sortMode = e.target.value; renderBoard(); });
window.addEventListener("beforeunload", (e) => { if (activeRuns.size || chatBusy) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- boot ---------- */
async function boot() {
  renderCountdown(); renderFilters(); renderAll();
  setInterval(renderCountdown, 60000);
  if (!window.claude || typeof window.claude.use !== "function") {
    loaded = true; notice("Open this board on claude.ai while signed in to load tickets and use Claude."); renderAll(); return;
  }
  const [dbNs, sampleFn, user] = await Promise.all([window.claude.use("db"), window.claude.use("sample"), window.claude.use("user")]);
  db = dbNs; sample = sampleFn;
  if (sample) { try { const lim = await sample.limits(); toolsOk = !!(lim && lim.tools); } catch { toolsOk = false; } }
  if (!db) { loaded = true; $("new-ticket").disabled = true; notice("Tickets can't load in this view. Open the board on claude.ai while signed in."); renderAll(); return; }
  try { const can = user ? await user.can("data.write") : null; if (can === false) { canWrite = false; $("new-ticket").hidden = true; notice("You're viewing this board read-only."); } } catch {}
  if (!sample) notice("Claude features are off in this view. Open the board in claude.ai to chat with tickets and run agents.");
  db.collection("tickets").onSnapshot((snap) => {
    tickets = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    loaded = true; renderDeck(); renderBoard();
    if (openId && !editing && !(tab === "chat" && chatBusy)) renderDialog();
  }, (e) => { loaded = true; notice(e && e.code === "revoked" ? "Access to this board changed. Reload to continue." : "Live updates stopped. Reload the page to reconnect."); renderAll(); });
  db.doc("meta/plan").onSnapshot((snap) => { plan = snap.exists ? snap.data() : null; renderDeck(); }, () => {});
}
boot();
</script>
